<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ICT Quiz</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Master Information & Communication Technology — quiz and study app with Bengali explanations" />
    <meta name="theme-color" content="#DCE4EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0F13" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the theme before first paint so dark users don't see a light flash.
      (function () {
        try {
          var saved = localStorage.getItem('ict-theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading">
      <style>
        .boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#DCE4EA}
        [data-theme="dark"] .boot{background:#0A0F13}
        .boot svg{--a:#2E7599;--s:#3A86AB;overflow:visible}
        [data-theme="dark"] .boot svg{--a:#82C3E0;--s:#6FB3D2}
        .boot .b{stroke:var(--a);fill:var(--a);fill-opacity:.12}
        .boot .p{stroke:var(--s);animation:bp 1.4s ease-in-out infinite}
        .boot .t{stroke:var(--a);fill:var(--a);fill-opacity:0;stroke-dasharray:1;stroke-dashoffset:1;animation:bt 1.4s ease-in-out infinite}
        @keyframes bt{0%{stroke-dashoffset:1;fill-opacity:0}45%{stroke-dashoffset:0;fill-opacity:0}60%,80%{stroke-dashoffset:0;fill-opacity:.85}100%{stroke-dashoffset:-1;fill-opacity:0}}
        @keyframes bp{0%,100%{opacity:.45}50%{opacity:1}}
        @media (prefers-reduced-motion:reduce){.boot .p{animation:none}.boot .t{animation:none;stroke-dashoffset:0;fill-opacity:.85}}
      </style>
      <svg width="56" height="56" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <g class="p" stroke-width="3" stroke-linecap="round"><path d="M24 8v8M24 48v8M32 8v8M32 48v8M40 8v8M40 48v8M8 24h8M48 24h8M8 32h8M48 32h8M8 40h8M48 40h8"/></g>
        <rect class="b" x="16" y="16" width="32" height="32" rx="7" stroke-width="3"/>
        <path class="t" pathLength="1" d="M35 20 25 34h7l-3 10 10-15h-7z" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
